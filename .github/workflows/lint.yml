name: Lint and Types

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: DMedina559/.github/.github/workflows/reusable-python-lint.yml@main
    with:
      extra-commands: |
        python scripts/check_api_callers.py
        python scripts/generate_plugin_api.py --check
