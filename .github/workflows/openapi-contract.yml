name: Backend OpenAPI Contract

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'main'
    paths:
      - 'src/bedrock_server_manager/**'
      - 'contracts/**'
      - 'pyproject.toml'
      - '.github/workflows/openapi-contract.yml'

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install contract tooling
        run: python -m pip install '.[contract]'
      - name: Verify canonical core contract
        run: python -m bedrock_server_manager.web.contract --check contracts/openapi.json
