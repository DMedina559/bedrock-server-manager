name: Runtime Control

on:
  push:
    branches-ignore: [main]
    paths:
      - 'src/bedrock_server_manager/web/runtime.py'
      - 'src/bedrock_server_manager/web/control.py'
      - 'src/bedrock_server_manager/web/routers/runtime.py'
      - 'src/bedrock_server_manager/web/middleware/ingress.py'
      - 'src/bedrock_server_manager/web/routers/api_info.py'
      - 'src/bedrock_server_manager/api/models/health.py'
      - 'src/bedrock_server_manager/api/system.py'
      - 'tests/web/test_runtime.py'
      - 'tests/web/test_local_readiness.py'
      - '.github/workflows/runtime-control.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-control:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - name: Check changed runtime files
        run: >-
          pre-commit run --show-diff-on-failure --files
          src/bedrock_server_manager/web/runtime.py
          src/bedrock_server_manager/web/control.py
          src/bedrock_server_manager/web/routers/runtime.py
          src/bedrock_server_manager/web/routers/api_info.py
          src/bedrock_server_manager/api/models/health.py
          src/bedrock_server_manager/api/system.py
          src/bedrock_server_manager/web/middleware/ingress.py
          tests/web/test_local_readiness.py
          docs/source/extras/web_runtime.md
          .github/workflows/runtime-control.yml
      - name: Check API contracts
        run: python scripts/export_openapi.py --output runtime-openapi.json
      - name: Test backend
        run: python -m pytest --durations=15
