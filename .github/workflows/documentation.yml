name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'CONTRIBUTING.md'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install '.[docs,cli]'
      - run: python scripts/generate_plugin_docs.py --check
      - run: python -m sphinx -W --keep-going -b html docs/source /tmp/bsm-docs
