name: Documentation

on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'CONTRIBUTING.md'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[docs,cli]'
      - run: python scripts/generate_plugin_docs.py --check
      - run: python -m sphinx -W --keep-going -b html docs/source /tmp/bsm-docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
